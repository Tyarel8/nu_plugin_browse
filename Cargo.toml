[package]
name        = "nu_plugin_browse"
version     = "0.7.0"
edition     = "2024"
description = "A nushell plugin to make http requests with a headless browser"
repository  = "https://github.com/Tyarel8/nu_plugin_browse"
license     = "MIT"

[dependencies]
chromiumoxide = "0.9.1"
futures       = "0.3.32"
nu-plugin     = "0.113.0"
nu-protocol   = "0.113.0"
tokio         = { version = "1.52.3", features = ["full"] }
